<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=7">
<title>userdata</title>
<script>
/* test/userdata-gate.sh: the userData behavior (addBehavior("#default#userData"), patches/sg/9604).
 * The gate loads the page twice: the second load reads what the first saved. */
function report(line) {
    var x = new XMLHttpRequest();
    x.open("GET", "/log?" + encodeURIComponent(line), false);
    x.send();
}
function run() {
    var el = document.getElementById("store"), cookie, r;
    try {
        cookie = el.addBehavior("#default#userData");
        report("cookie=" + (cookie > 0));
        el.load("prefs");
        if (location.search.indexOf("second") < 0) {
            report("first before=" + el.getAttribute("colour"));
            el.setAttribute("colour", "blue & <green>");
            el.setAttribute("size", 12);
            el.save("prefs");
            el.setAttribute("colour", "changed");
            el.load("prefs");
            report("first reloaded=" + el.getAttribute("colour") + " size=" + el.getAttribute("size"));
            el.setAttribute("temp", "x");
            report("removed=" + el.removeAttribute("temp") + " after=" + el.getAttribute("temp"));
            report("id=" + el.getAttribute("id"));
            report("htc=" + el.addBehavior("missing.htc"));
            r = el.removeBehavior(cookie);
            report("detached=" + r + " again=" + el.removeBehavior(cookie));
            report("first done");
        } else {
            report("second colour=" + el.getAttribute("colour") + " size=" + el.getAttribute("size"));
            report("second done");
        }
    } catch (e) { report("THREW " + e.message); }
}
window.onload = run;
</script>
</head>
<body><div id="store">x</div></body>
</html>
