<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=7">
<title>elemexpr</title>
<script>
/* test/elemexpr-gate.sh: IHTMLElement2 setExpression/getExpression/removeExpression and document.recalc
 * (dynamic properties on elements, patches/sg/9602).  Each report goes back to the gate's HTTP server. */
function report(line) {
    var x = new XMLHttpRequest();
    x.open("GET", "/log?" + encodeURIComponent(line), false);
    x.send();
}
var n = 1;
function run() {
    var el = document.getElementById("box"), r;
    report("loaded");
    try {
        el.setExpression("title", "'n=' + n");
        report("set title=" + el.title);
        report("get=" + el.getExpression("title"));
        n = 2; document.recalc(true);
        report("recalc title=" + el.title);
        el.setExpression("style.width", "n * 12 + 'px'", "JScript");
        report("style width=" + el.style.width);
        el.setExpression("myValue", "n * 3");
        report("expando=" + el.myValue);
        r = el.removeExpression("title");
        report("removed=" + r + " again=" + el.removeExpression("title"));
        n = 5; document.recalc(true);
        report("after remove title=" + el.title + " get=" + typeof el.getExpression("title"));
    } catch (e) { report("THREW " + e.message); }
    report("done");
}
window.onload = run;
</script>
</head>
<body><div id="box" style="height:20px">x</div></body>
</html>
