<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=7">
<title>createpopup</title>
<script>
/* test/createpopup-gate.sh: window.createPopup (patches/sg/9605). Reports go back to the gate's HTTP server;
 * the gate looks for the popup's window on the display while the page waits. */
function report(line) {
    var x = new XMLHttpRequest();
    x.open("GET", "/log?" + encodeURIComponent(line), false);
    x.send();
}
var p;
function run() {
    report("loaded");
    try {
        p = window.createPopup();
        report("created=" + (typeof p) + " open=" + p.isOpen);
        var b = p.document.body;
        b.innerHTML = "<b>popup text</b>";
        b.style.backgroundColor = "yellow";
        report("text=" + b.innerText);
        p.show(20, 30, 123, 45, document.body);
        report("shown open=" + p.isOpen);
        setTimeout(function () {
            try {
                p.hide();
                report("hidden open=" + p.isOpen);
                var q = window.createPopup();
                q.show(0, 0, 50, 20);
                report("second open=" + q.isOpen + " first=" + p.isOpen);
            } catch (e) { report("THREW " + e.message); }
            report("done");
        }, 4000);
    } catch (e) { report("THREW " + e.message); report("done"); }
}
window.onload = run;
</script>
</head>
<body><div>page</div></body>
</html>
