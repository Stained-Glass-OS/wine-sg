<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=11">
<title>kbchar</title>
<script>
/* test/kbchar-gate.sh: IE's KeyboardEvent.char (patches/sg/0534).  Each
 * report goes back to the gate's HTTP server as a GET. */
function report(line) {
    var x = new XMLHttpRequest();
    x.open("GET", "/log?" + encodeURIComponent(line), false);
    x.send();
}
document.addEventListener("keydown", function (e) {
    var c;
    try { c = "[" + e["char"] + "]"; } catch (x) { c = "THREW"; }
    report("key=" + e.key + " char=" + c);
}, false);
window.onload = function () { document.getElementById("t").focus(); report("loaded"); };
</script>
</head>
<body style="margin:0"><input id="t" style="position:absolute;left:0;top:0;width:100%;height:100%"></body>
</html>
