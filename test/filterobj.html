<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=7">
<title>filterobj</title>
<script>
/* test/filterobj-gate.sh: element.filters (filter objects, patches/sg/9603). Reports go back to the
 * gate's HTTP server. */
function report(line) {
    var x = new XMLHttpRequest();
    x.open("GET", "/log?" + encodeURIComponent(line), false);
    x.send();
}
function run() {
    var el = document.getElementById("box"), f, t;
    report("loaded");
    try {
        el.style.filter = "alpha(opacity=40) progid:DXImageTransform.Microsoft.Blur(pixelRadius=2)";
        report("length=" + el.filters.length);
        report("alpha=" + el.filters.alpha.opacity + " byindex=" + el.filters[0].opacity);
        report("blur=" + el.filters.item("DXImageTransform.Microsoft.Blur").pixelRadius);
        el.filters.alpha.opacity = 70;
        report("set filter=" + el.style.filter);
        el.style.filter = "alpha(opacity=70)";
        el.filters.alpha.finishOpacity = 10;
        report("added=" + el.style.filter);
        f = document.getElementById("inline").filters;
        report("inline length=" + f.length + " opacity=" + f.alpha.opacity);
        el.style.filter = "alpha()";
        report("default opacity=" + el.filters.alpha.opacity);
        el.style.filter = "blendTrans(duration=1)";
        t = el.filters.blendTrans;
        t.apply();
        var applied = t.status;
        t.play();
        report("trans status=" + applied + " after play=" + t.status);
        report("none length=" + document.body.filters.length);
        el.style.filter = "progid:DXImageTransform.Microsoft.Alpha(Opacity=25)";
        report("progid opacity=" + (/opacity: *0\.25/i.test(el.style.cssText) ? "0.25" : el.style.cssText));
    } catch (e) { report("THREW " + e.message); }
    report("done");
}
window.onload = run;
</script>
</head>
<body><div id="box" style="height:20px">x</div><div id="inline" style="width:20px; filter:alpha(opacity=30)">y</div></body>
</html>
