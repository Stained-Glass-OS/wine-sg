<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=7">
<title>cssexpr</title>
<script>
/* test/cssexpr-gate.sh: IHTMLStyle2 setExpression/getExpression/removeExpression and document.recalc
 * (dynamic properties, patches/sg/8228).  Each report goes back to the gate's HTTP server as a GET. */
function report(line) {
    var x = new XMLHttpRequest();
    x.open("GET", "/log?" + encodeURIComponent(line), false);
    x.send();
}
var w = 10;
function run() {
    var s = document.getElementById("box").style, r;
    report("loaded");
    try {
        s.setExpression("width", "w + 'px'");
        report("set width=" + s.width);
        report("get=" + s.getExpression("width"));
        w = 30; document.recalc(true);
        report("recalc width=" + s.width);
        s.setExpression("backgroundColor", "w > 20 ? 'red' : 'blue'", "JScript");
        report("bg=" + s.backgroundColor);
        r = s.removeExpression("width");
        report("removed=" + r + " again=" + s.removeExpression("width"));
        w = 50; document.recalc(true);
        report("after remove width=" + s.width + " get=" + typeof s.getExpression("width"));
    } catch (e) { report("THREW " + e.message); }
    report("done");
}
window.onload = run;
</script>
</head>
<body><div id="box" style="height:20px">x</div></body>
</html>
