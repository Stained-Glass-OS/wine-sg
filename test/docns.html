<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml">
<head>
<meta http-equiv="X-UA-Compatible" content="IE=7">
<title>docns</title>
<script>
/* test/docns-gate.sh: document.namespaces (patches/sg/9606). Reports go back to the gate's HTTP server. */
function report(line) {
    var x = new XMLHttpRequest();
    x.open("GET", "/log?" + encodeURIComponent(line), false);
    x.send();
}
function run() {
    var ns, n;
    report("loaded");
    try {
        ns = document.namespaces;
        report("declared length=" + ns.length + " name=" + ns.item(0).name + " urn=" + ns.item(0).urn);
        n = ns.add("o", "urn:schemas-microsoft-com:office:office");
        report("added name=" + n.name + " urn=" + n.urn + " state=" + n.readyState);
        report("after length=" + ns.length + " byname=" + ns.item("o").urn);
        ns.add("o", "urn:other");
        report("again length=" + ns.length + " urn=" + ns.item("o").urn);
        report("vml=" + (ns.item("v") ? ns.item("v").urn : "none"));
    } catch (e) { report("THREW " + e.message); }
    report("done");
}
window.onload = run;
</script>
</head>
<body><div>x</div></body>
</html>
