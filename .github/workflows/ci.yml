name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gate:
    name: build Wine + WoW64 gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Debian trixie, because that is what the image is built from and what the
    # binutils 2.44 patch is calibrated against.
    container:
      image: debian:trixie
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # Wine takes most of this job's wall clock. The object tree only needs
      # rebuilding when the upstream version or the patch series changes, so
      # key the cache on exactly those two things -- not on the commit, which
      # would miss the cache on every docs change.
      - name: Cache the Wine build tree
        uses: actions/cache@v4
        with:
          path: build
          key: wine-build-${{ runner.os }}-${{ hashFiles('wine-version', 'patches/**', 'theme/**') }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper equivs \
            curl ca-certificates xz-utils patch file procps make python3 \
            gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 mingw-w64-tools
          # Wine's own build-deps, from the distribution's wine source package.
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y --no-install-recommends wine
          apt-get install -y --no-install-recommends libsane-dev

      - name: Lint (no user-visible "Windows" in what our patches add)
        run: make lint

      - name: Build
        run: make build

      - name: Install
        run: make install

      - name: WoW64 gate
        run: make test
